<svg
  width="1000"
  height="150"
  viewBox="0 0 1000 150"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

<style>

  .header {
    font: 700 17px 'Segoe UI', Ubuntu, Sans-Serif;
    fill: #F59E0B;
  }

  .label {
    font: 600 11px 'Segoe UI', Ubuntu, Sans-Serif;
    fill: #71717A;
    letter-spacing: 0.05em;
  }

  .value {
    font: 700 25px 'Segoe UI', Ubuntu, Sans-Serif;
    fill: #FFFFFF;
  }

  .green {
    font: 700 25px 'Segoe UI', Ubuntu, Sans-Serif;
    fill: #10B981;
  }

  .amber {
    font: 700 25px 'Segoe UI', Ubuntu, Sans-Serif;
    fill: #F59E0B;
  }

  .card {
    fill: #0A0A0A;
    stroke: #262626;
    stroke-width: 1;
  }

</style>

<rect
  class="card"
  x="1"
  y="1"
  width="998"
  height="148"
  rx="12"
/>

<text
  x="28"
  y="34"
  class="header"
>
  GITHUB CONTRIBUTION STREAK
</text>

<circle
  cx="970"
  cy="30"
  r="4"
  fill="#10B981"
/>


<!-- CURRENT STREAK -->

<text
  x="28"
  y="70"
  class="label"
>
  CURRENT STREAK
</text>

<text
  x="28"
  y="103"
  class="green"
>
  0 DAYS
</text>


<!-- LONGEST STREAK -->

<text
  x="278"
  y="70"
  class="label"
>
  LONGEST STREAK
</text>

<text
  x="278"
  y="103"
  class="amber"
>
  30 DAYS
</text>


<!-- CONTRIBUTIONS -->

<text
  x="528"
  y="70"
  class="label"
>
  CONTRIBUTIONS · 1 YEAR
</text>

<text
  x="528"
  y="103"
  class="value"
>
  439
</text>


<!-- COMMITS -->

<text
  x="768"
  y="70"
  class="label"
>
  COMMITS · 1 YEAR
</text>

<text
  x="768"
  y="103"
  class="value"
>
  315
</text>

</svg>
